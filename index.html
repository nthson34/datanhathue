<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>DỮ LIỆU NHÀ THUÊ</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter,sans-serif;
background:#f1f5f9;
}

.card{
border-radius:16px;
}

.badge{
font-size:12px;
padding:4px 10px;
border-radius:999px;
}

.thumb{
height:130px;
border-radius:12px;
background-size:cover;
background-position:center;
cursor:pointer;
}

#imgModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center;
z-index:50;
}

#modalImg{
max-width:100vw;
max-height:100vh;
object-fit:contain;
}

</style>
</head>

<body>

<header class="bg-indigo-700 text-white text-center py-4 font-bold text-xl">
DỮ LIỆU NHÀ THUÊ
</header>

<main class="max-w-3xl mx-auto p-3 space-y-4">

<input id="search"
placeholder="🔍 Tìm địa chỉ / SĐT / giá"
class="w-full p-3 rounded-xl border">

<div id="loading"
class="text-center py-8">
Đang tải dữ liệu...
</div>

<div id="list" class="space-y-4"></div>

</main>


<div id="imgModal">
<img id="modalImg">
</div>


<script>

/* ================= CONFIG ================= */

const SHEET_ID="14ntbPzHZdUEBAx7FxwEfpO0wBjyqaxNzXVYYphe_q2A"
const GID="61368668"

const URL=
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`

const $=id=>document.getElementById(id)

let DATA=[]
let DISPLAY_DATA=[]


/* ================= DRIVE IMAGE ================= */

function driveToImage(url){

if(!url) return ""

let m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)
||url.match(/id=([a-zA-Z0-9_-]+)/)

return m
?`https://lh3.googleusercontent.com/d/${m[1]}=w2000`
:""

}


/* ================= LOAD DATA ================= */

async function loadData(){

try{

const res=await fetch(URL)

const text=await res.text()

const json=JSON.parse(
text.substring(47).slice(0,-2)
)

const rows=json.table.rows


DATA=rows.map(r=>{

const c=r.c

const images=[
driveToImage(c?.[7]?.v),
driveToImage(c?.[8]?.v),
driveToImage(c?.[9]?.v)
].filter(Boolean)

return{

owner:c?.[0]?.v || "",
phone:c?.[1]?.v || "",
address:c?.[2]?.v || "",
price:c?.[3]?.v || "",
deposit:c?.[4]?.v || "",
commission:c?.[5]?.v || "",
imageLink:c?.[6]?.v || "",
images

}

})


DISPLAY_DATA=[...DATA]

$("loading").style.display="none"

render(DISPLAY_DATA)

}catch(err){

console.error(err)

$("loading").innerText="Không tải được dữ liệu"

}

}


/* ================= SEARCH ================= */

$("search").oninput=function(){

const k=this.value.toLowerCase()

DISPLAY_DATA=DATA.filter(i=>

(i.address+i.phone+i.price+i.deposit+i.commission)

.toLowerCase()

.includes(k)

)

render(DISPLAY_DATA)

}


/* ================= COPY PHONE ================= */

function copyPhone(phone){

navigator.clipboard.writeText(phone)

alert("Đã copy: "+phone)

}


/* ================= RENDER ================= */

function render(arr){

const box=$("list")

box.innerHTML=""

arr.forEach((i,ci)=>{

box.innerHTML+=`

<div class="card bg-white p-4 shadow space-y-3">

${i.images.length?`

<div class="grid grid-cols-3 gap-2">

${i.images.map(img=>`

<div class="thumb"
onclick="openImg('${img}')"
style="background-image:url('${img}')">
</div>

`).join("")}

</div>

`:""}


<div class="font-bold text-indigo-700">
📍 ${i.address}
</div>

<div class="text-red-600 font-bold">
💰 ${i.price}
</div>

<div class="flex gap-2">

<span class="badge bg-gray-100">
Cọc ${i.deposit}
</span>

<span class="badge bg-green-100">
HH ${i.commission}
</span>

</div>

<div class="flex gap-2">

<a href="tel:${i.phone}"
class="flex-1 bg-green-600 text-white py-2 rounded-xl text-center">
📞 ${i.phone}
</a>

<button onclick="copyPhone('${i.phone}')"
class="bg-gray-200 px-3 rounded-xl">
📋
</button>

</div>

<div class="text-sm text-gray-500">
👤 ${i.owner}
</div>

</div>

`

})

}


/* ================= IMAGE POPUP ================= */

function openImg(src){

$("modalImg").src=src

$("imgModal").style.display="flex"

}

$("imgModal").onclick=function(){

this.style.display="none"

}


/* ================= START ================= */

loadData()

</script>

</body>
</html>
