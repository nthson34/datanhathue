<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DỮ LIỆU NHÀ THUÊ</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{font-family:Inter,sans-serif;background:#f1f5f9;overscroll-behavior:none}
.card{border-radius:18px}
.badge{font-size:12px;padding:4px 10px;border-radius:999px}

.thumb{
height:140px;
border-radius:14px;
background-size:cover;
background-position:center;
cursor:pointer
}

#imgModal{touch-action:none;z-index:50}

#modalImg{
max-width:100vw;
max-height:100vh;
object-fit:contain;
transform-origin:center;
transition:transform .12s ease;
user-select:none
}
</style>
</head>

<body>

<header class="bg-gradient-to-r from-indigo-700 to-blue-700 text-white sticky top-0 z-20 shadow">
<div class="max-w-3xl mx-auto px-4 py-4 space-y-3">

<h1 class="text-2xl font-extrabold text-center">
DỮ LIỆU NHÀ THUÊ
</h1>

<div class="flex gap-2">
<input id="search" type="text"
placeholder="🔍 Địa chỉ | SĐT | Giá | Hoa hồng"
class="flex-1 p-3 rounded-xl text-gray-800" disabled>

<button id="btn"
class="bg-white/20 px-4 rounded-xl font-semibold text-sm"
disabled>Tìm</button>
</div>

</div>
</header>


<main class="max-w-3xl mx-auto p-3 space-y-4">

<div id="loading"
class="bg-white p-6 rounded-xl shadow text-center">

<div class="w-8 h-8 border-4 border-gray-200 border-t-blue-600 rounded-full animate-spin mx-auto mb-3"></div>

<p class="text-sm">
Đang tải dữ liệu...
</p>

</div>

<div id="list" class="space-y-4 hidden"></div>

<div id="empty"
class="hidden bg-yellow-50 border-l-4 border-yellow-500 p-4 text-sm">
Không tìm thấy tài sản phù hợp
</div>

</main>


<div id="imgModal"
class="fixed inset-0 bg-black/90 hidden flex items-center justify-center">

<div id="imgCount"
class="absolute top-4 left-4 text-white text-sm"></div>

<button onclick="closeModal()"
class="absolute top-4 right-4 text-white text-3xl">
✕
</button>

<img id="modalImg">

</div>


<script>

/* ================= CONFIG ================= */

const SHEET_ID='14ntbPzHZdUEBAx7FxwEfpO0wBjyqaxNzXVYYphe_q2A'
const GID='61368668'

const URL=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`

const $=id=>document.getElementById(id)

let DATA=[]
let DISPLAY_DATA=[]


/* ================= IMAGE ================= */

function driveToImage(url){

if(!url) return ''

let m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)
||url.match(/id=([a-zA-Z0-9_-]+)/)

return m
?`https://lh3.googleusercontent.com/d/${m[1]}=w2000`
:''

}


/* ================= CSV PARSER ================= */

function parseCSV(text){

const rows=[]
let row=[]
let current=''
let insideQuote=false

for(let char of text){

if(char=='"' ){
insideQuote=!insideQuote
continue
}

if(char==',' && !insideQuote){
row.push(current)
current=''
continue
}

if(char=='\n' && !insideQuote){
row.push(current)
rows.push(row)
row=[]
current=''
continue
}

current+=char
}

row.push(current)
rows.push(row)

return rows
}


/* ================= LOAD DATA ================= */

async function loadData(){

try{

const res=await fetch(URL)

const txt=await res.text()

const rows=parseCSV(txt).slice(1)

DATA=rows.map(c=>{

const images=[
driveToImage(c[7]),
driveToImage(c[8]),
driveToImage(c[9])
].filter(Boolean)

return{

owner:c[0]||'',
phone:c[1]||'',
address:c[2]||'',
price:c[3]||'',
deposit:c[4]||'',
commission:c[5]||'',
imageLink:c[6]||'',
images

}

}).filter(i=>i.address && i.address.trim()!=='')

DISPLAY_DATA=[...DATA]

$('loading').classList.add('hidden')
$('search').disabled=false
$('btn').disabled=false

render(DISPLAY_DATA)

}catch(err){

console.error(err)
document.querySelector('#loading p').innerText='Lỗi tải dữ liệu'

}

}


/* ================= SEARCH ================= */

function search(){

const k=$('search').value.toLowerCase().trim()

DISPLAY_DATA=!k
?[...DATA]
:DATA.filter(i=>
[i.address,i.phone,i.price,i.deposit,i.commission]
.join(' ')
.toLowerCase()
.includes(k)
)

render(DISPLAY_DATA)

}


/* ================= COPY PHONE ================= */

function copyPhone(btn,phone){

navigator.clipboard.writeText(phone)
.then(()=>{

const old=btn.innerHTML
btn.innerHTML='✓'

setTimeout(()=>btn.innerHTML=old,1000)

})

}


/* ================= RENDER ================= */

function render(arr){

const box=$('list')

box.innerHTML=''

$('empty').classList.add('hidden')

if(!arr.length){

box.classList.add('hidden')
$('empty').classList.remove('hidden')

return

}

box.classList.remove('hidden')

box.innerHTML=arr.map((i,ci)=>`

<div class="card bg-white p-4 shadow space-y-3">

${i.images.length?`
<div class="grid grid-cols-3 gap-2">

${i.images.map((img,idx)=>`
<div class="thumb"
data-idx="${idx}"
data-card="${ci}"
style="background-image:url('${img}')">
</div>
`).join('')}

</div>`:''}

<div class="bg-indigo-50 border border-indigo-200 rounded-xl p-3">

<div class="text-xs uppercase text-indigo-500">
Địa chỉ
</div>

<div class="font-bold text-indigo-800">
📍
<a href="${i.imageLink||'#'}"
target="_blank"
class="hover:underline">
${i.address}
</a>
</div>

</div>

<div class="bg-red-50 border border-red-200 text-red-700 font-extrabold px-3 py-2 rounded-xl text-sm">
💰 Giá thuê: ${i.price}
</div>

<div class="flex gap-2">

<span class="badge bg-gray-100">
Cọc ${i.deposit}
</span>

<span class="badge bg-green-100 text-green-700 font-semibold">
HH ${i.commission}
</span>

</div>

<div class="flex gap-2">

<a href="tel:${i.phone}"
class="flex-1 bg-green-600 text-white py-2 rounded-xl text-center font-semibold">
📞 GỌI NGAY (${i.phone})
</a>

<button onclick="copyPhone(this,'${i.phone}')"
class="bg-gray-200 px-3 rounded-xl">
📋
</button>

</div>

${i.images.length>1?`
<div class="text-right">
<a href="${i.imageLink||'#'}"
target="_blank"
class="text-sm text-blue-600 hover:underline font-semibold">
Xem thêm ảnh
</a>
</div>`:''}

<div class="text-sm text-gray-500">
👤 ${i.owner}
</div>

</div>

`).join('')

}


/* ================= POPUP ================= */

let modalImgs=[]
let modalIdx=0

const imgModal=$('imgModal')
const modalImg=$('modalImg')
const imgCount=$('imgCount')

document.addEventListener('click',e=>{

const t=e.target.closest('.thumb')
if(!t) return

const cardIdx=+t.dataset.card

modalImgs=DISPLAY_DATA[cardIdx].images

modalIdx=+t.dataset.idx

openModal()

})

function openModal(){

modalImg.src=modalImgs[modalIdx]

imgCount.innerText=
`${modalIdx+1}/${modalImgs.length}`

imgModal.classList.remove('hidden')

}

function closeModal(){

imgModal.classList.add('hidden')

}


/* ================= EVENTS ================= */

$('btn').onclick=search

$('search').addEventListener('keydown',e=>{
if(e.key==='Enter') search()
})


/* ================= START ================= */

loadData()

</script>

</body>
</html>
