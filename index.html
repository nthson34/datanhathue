<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DỮ LIỆU NHÀ THUÊ</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

body{
font-family:Inter,sans-serif;
background:#f1f5f9;
}

.card{border-radius:18px}

.badge{
font-size:12px;
padding:4px 10px;
border-radius:999px
}

.thumb{
height:140px;
border-radius:14px;
background-size:cover;
background-position:center;
cursor:pointer
}

#imgModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.9);
display:none;
align-items:center;
justify-content:center
}

#modalImg{
max-width:100vw;
max-height:100vh;
object-fit:contain
}

</style>
</head>


<body>

<header class="bg-indigo-700 text-white p-4 text-center font-bold text-xl">
DỮ LIỆU NHÀ THUÊ
</header>


<div class="max-w-3xl mx-auto p-3">

<input id="search"
placeholder="🔍 Tìm địa chỉ / SĐT"
class="w-full p-3 rounded-xl border mb-4">

<div id="loading" class="text-center p-6">
Đang tải dữ liệu...
</div>

<div id="list" class="space-y-4"></div>

</div>


<div id="imgModal">
<img id="modalImg">
</div>


<script>

/* CONFIG */

const SHEET_ID="14ntbPzHZdUEBAx7FxwEfpO0wBjyqaxNzXVYYphe_q2A"
const GID="61368668"

const URL=
`https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=${GID}`


const $=id=>document.getElementById(id)

let DATA=[]
let DISPLAY_DATA=[]


/* DRIVE IMAGE */

function driveToImage(url){

if(!url) return ''

let m=url.match(/\/d\/([a-zA-Z0-9_-]+)/)
||url.match(/id=([a-zA-Z0-9_-]+)/)

return m
?`https://lh3.googleusercontent.com/d/${m[1]}=w2000`
:''

}



/* LOAD DATA */

function loadData(){

Papa.parse(URL,{

download:true,
header:false,
skipEmptyLines:true,

complete:function(results){

const rows=results.data.slice(1)

DATA=rows.map(c=>{

const images=[
driveToImage(c[7]),
driveToImage(c[8]),
driveToImage(c[9])
].filter(Boolean)

return{

owner:c[0]||'',
phone:c[1]||'',
address:c[2]||'',
price:c[3]||'',
deposit:c[4]||'',
commission:c[5]||'',
imageLink:c[6]||'',
images

}

})

DISPLAY_DATA=[...DATA]

$("loading").style.display="none"

render(DISPLAY_DATA)

}

})

}



/* SEARCH */

$("search").oninput=function(){

const k=this.value.toLowerCase()

DISPLAY_DATA=DATA.filter(i=>

(i.address+i.phone+i.price+i.deposit+i.commission)

.toLowerCase()

.includes(k)

)

render(DISPLAY_DATA)

}



/* RENDER */

function render(arr){

const box=$("list")

box.innerHTML=""

arr.forEach((i,ci)=>{

box.innerHTML+=`

<div class="card bg-white p-4 shadow space-y-3">

${i.images.length?`

<div class="grid grid-cols-3 gap-2">

${i.images.map((img,idx)=>`

<div class="thumb"
onclick="openImg('${img}')"
style="background-image:url('${img}')">
</div>

`).join("")}

</div>`:""}


<div class="font-bold text-indigo-700">
📍 ${i.address}
</div>

<div class="text-red-600 font-bold">
💰 ${i.price}
</div>

<div class="flex gap-2">

<span class="badge bg-gray-100">
Cọc ${i.deposit}
</span>

<span class="badge bg-green-100">
HH ${i.commission}
</span>

</div>

<div class="flex gap-2">

<a href="tel:${i.phone}"
class="flex-1 bg-green-600 text-white py-2 rounded-xl text-center">

📞 ${i.phone}

</a>

</div>

<div class="text-sm text-gray-500">
👤 ${i.owner}
</div>

</div>

`

})

}



/* IMAGE POPUP */

function openImg(src){

$("modalImg").src=src
$("imgModal").style.display="flex"

}

$("imgModal").onclick=function(){

this.style.display="none"

}



/* START */

loadData()

</script>

</body>
</html>
