<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <title>DỮ LIỆU NHÀ THUÊ - HOÀNG SƠN</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* Chống tràn toàn trang */
        html, body { 
            max-width: 100vw; 
            overflow-x: hidden; 
            margin: 0; 
            padding: 0;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
        }

        .card { 
            border-radius: 20px; 
            overflow: hidden; 
            width: 100%;
        }

        .badge { 
            font-size: 10px; 
            padding: 3px 10px; 
            border-radius: 999px; 
            font-weight: 600; 
            white-space: nowrap;
        }
        
        /* Grid ảnh tối ưu mobile */
        .image-grid { 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px; 
            width: 100%;
        }
        .image-grid .thumb:first-child:nth-last-child(1) { grid-column: span 3; height: 180px; }
        .image-grid .thumb:first-child:nth-last-child(2), 
        .image-grid .thumb:first-child:nth-last-child(2) ~ .thumb { grid-column: span 1; height: 120px; }
        
        .thumb { 
            height: 100px; 
            border-radius: 12px; 
            background-size: cover; 
            background-position: center; 
            background-color: #e2e8f0; 
            transition: opacity 0.3s ease-in;
        }
        
        .thumb.loading { opacity: 0.5; }
        .thumb.loaded { opacity: 1; }

        #imgModal { 
            position: fixed; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            display: none; 
            align-items: center; 
            justify-content: center; 
            z-index: 100; 
            padding: 10px; 
        }
        #modalImg { max-width: 100%; max-height: 85vh; border-radius: 8px; object-fit: contain; }
        
        .copy-toast { 
            position: fixed; 
            bottom: 30px; 
            left: 50%; 
            transform: translateX(-50%); 
            background: #1e293b; 
            color: white; 
            padding: 8px 16px; 
            border-radius: 30px; 
            display: none; 
            z-index: 200; 
            font-size: 13px; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.2); 
        }
        
        .drive-search-bar { 
            background: #f0f4ff; 
            border: 1px dashed #6366f1; 
            border-radius: 16px; 
        }

        /* Tối ưu kích thước chữ cho mobile */
        h3 { font-size: 13px !important; }
        .price-text { font-size: 15px !important; }
    </style>
</head>
<body>

<header class="bg-indigo-700 text-white sticky top-0 z-40 shadow-sm">
    <div class="max-w-xl mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="font-extrabold text-lg tracking-tight uppercase">Dữ Liệu Nhà Thuê</h1>
        <div id="count" class="bg-indigo-800 px-3 py-1 rounded-full text-[10px] font-bold">...</div>
    </div>
</header>

<main class="max-w-xl mx-auto p-3 space-y-4">
    <!-- Search Bar -->
    <div class="space-y-3">
        <div class="flex items-center gap-2">
            <div class="relative flex-1">
                <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">🔍</span>
                <input id="search" type="text" 
                       placeholder="Tìm địa chỉ, giá..." 
                       class="w-full pl-10 pr-4 py-3 rounded-2xl border-none ring-1 ring-gray-100 focus:ring-2 focus:ring-indigo-500 shadow-sm outline-none text-sm bg-white">
            </div>
            <button id="searchBtn" class="bg-indigo-600 text-white p-3 rounded-2xl shadow-md">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            </button>
        </div>
        
        <div id="driveShortcut" class="drive-search-bar p-3 flex items-center justify-between hidden">
            <span class="text-[10px] font-bold text-indigo-700 uppercase">Tìm sâu hơn trong Drive?</span>
            <button id="openDriveSearch" class="bg-indigo-600 text-white px-3 py-1.5 rounded-lg text-[10px] font-bold uppercase">
                Quét Drive
            </button>
        </div>
    </div>

    <div id="loading" class="flex flex-col items-center py-20 space-y-3 text-gray-400">
        <div class="w-6 h-6 border-3 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-medium">Đang đồng bộ dữ liệu...</p>
    </div>

    <div id="list" class="space-y-5 pb-10"></div>
</main>

<div id="imgModal" onclick="this.style.display='none'">
    <img id="modalImg" src="">
</div>

<div id="toast" class="copy-toast"></div>

<script>
const SHEET_ID = "14ntbPzHZdUEBAx7FxwEfpO0wBjyqaxNzXVYYphe_q2A";
const GID = "61368668";
const DRIVE_FOLDER_ID = "1mp7r0mKo_C_PvxxkKJDaRYO3xKLyIMDx";
const URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${GID}&tqx=out:json`;

const $ = id => document.getElementById(id);
let ALL_DATA = [];

function driveToThumbnail(url) {
    if (!url) return "";
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w400` : ""; 
}

function driveToFull(url) {
    if (!url) return "";
    const m = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    return m ? `https://lh3.googleusercontent.com/d/${m[1]}=w1200` : ""; 
}

function parseImages(rowCells) {
    let rawLinks = [];
    [7, 8, 9].forEach(idx => {
        const cellValue = rowCells[idx]?.v;
        if (cellValue) {
            const links = String(cellValue).split(/[\s,\n]+/).filter(l => l.includes('drive.google.com'));
            rawLinks = [...rawLinks, ...links];
        }
    });
    const uniqueRaw = [...new Set(rawLinks)];
    return {
        thumbnails: uniqueRaw.map(driveToThumbnail).filter(Boolean),
        fulls: uniqueRaw.map(driveToFull).filter(Boolean),
        raw: uniqueRaw
    };
}

function showToast(msg) {
    const t = $("toast");
    t.innerText = msg;
    t.style.display = "block";
    setTimeout(() => { t.style.display = "none"; }, 2500);
}

function copyToClipboard(text, msg = "✅ Đã copy!") {
    const dummy = document.createElement("textarea");
    document.body.appendChild(dummy);
    dummy.value = text;
    dummy.select();
    document.execCommand('copy');
    document.body.removeChild(dummy);
    showToast(msg);
}

async function loadData() {
    try {
        const res = await fetch(URL);
        const text = await res.text();
        const json = JSON.parse(text.substring(47).slice(0, -2));
        const rows = json.table.rows;

        ALL_DATA = rows.map(r => {
            const c = r.c;
            const imgData = parseImages(c);
            return {
                owner: String(c?.[0]?.v || "").trim(),
                phone: String(c?.[1]?.v || "").trim(),
                address: String(c?.[2]?.v || "Chưa có địa chỉ").trim(),
                price: String(c?.[3]?.v || "Thỏa thuận").trim(),
                deposit: String(c?.[4]?.v || "Thỏa thuận").trim(),
                commission: String(c?.[5]?.v || "N/A").trim(),
                detailLink: String(c?.[6]?.v || "").trim(),
                images: imgData.thumbnails,
                fullImages: imgData.fulls,
                rawImgLinks: imgData.raw
            };
        });

        $("loading").style.display = "none";
        render(ALL_DATA);
    } catch (err) {
        console.error(err);
        $("loading").innerHTML = `<p class="text-red-500 font-bold text-xs">❌ Lỗi kết nối dữ liệu.</p>`;
    }
}

function performSearch() {
    const keyword = $("search").value.toLowerCase().trim();
    if(keyword !== "") $("driveShortcut").classList.remove("hidden");
    else $("driveShortcut").classList.add("hidden");
    
    $("list").innerHTML = `<div class="text-center py-20 text-gray-400 animate-pulse text-xs">Đang tìm...</div>`;
    
    setTimeout(() => {
        const filtered = ALL_DATA.filter(i => {
            const searchStr = `${i.address} ${i.phone} ${i.price} ${i.owner}`.toLowerCase();
            return searchStr.includes(keyword);
        });
        render(filtered);
    }, 100);
}

$("openDriveSearch").onclick = () => {
    const keyword = $("search").value.trim();
    if(keyword) {
        const driveSearchUrl = `https://drive.google.com/drive/u/0/search?q=parent:${DRIVE_FOLDER_ID}%20${encodeURIComponent(keyword)}`;
        window.open(driveSearchUrl, '_blank');
    }
};

$("search").addEventListener("keypress", (e) => { if (e.key === "Enter") performSearch(); });
$("searchBtn").addEventListener("click", performSearch);

function render(arr) {
    const box = $("list");
    $("count").innerText = `${arr.length} căn`;
    
    if(arr.length === 0) {
        box.innerHTML = `<div class="text-center py-20 text-gray-400 text-xs">Không có kết quả</div>`;
        return;
    }

    const fragment = document.createDocumentFragment();

    arr.forEach((item) => {
        const div = document.createElement("div");
        div.className = "card bg-white shadow-sm ring-1 ring-gray-100 p-2 space-y-3";
        
        div.innerHTML = `
            <div class="image-grid">
                ${item.images.slice(0,3).map((img, idx) => `
                    <div class="thumb loading" 
                         data-src="${img}" 
                         data-full="${item.fullImages[idx]}"
                         onclick="openImg(this.getAttribute('data-full'))">
                    </div>
                `).join("")}
            </div>

            <div class="px-1 space-y-3">
                <div class="flex justify-between items-start gap-2">
                    <h3 class="font-bold text-gray-900 leading-tight flex-1">📍 ${item.address}</h3>
                    <span class="price-text text-indigo-600 font-extrabold whitespace-nowrap">${item.price}</span>
                </div>
                
                <div class="flex flex-wrap gap-2">
                    <span class="badge bg-amber-50 text-amber-700">Cọc: ${item.deposit}</span>
                    <span class="badge bg-emerald-50 text-emerald-700">HH: ${item.commission}</span>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <button class="btn-detail bg-indigo-50 text-indigo-700 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center justify-center gap-1 border border-indigo-100">
                        📂 Folder
                    </button>
                    <button class="btn-copy-imgs bg-indigo-50 text-indigo-700 py-2.5 rounded-xl font-bold text-[10px] uppercase flex items-center justify-center gap-1 border border-indigo-100">
                        🖼️ Link Ảnh
                    </button>
                </div>

                <button class="btn-copy-phone w-full bg-emerald-600 text-white py-3.5 rounded-xl font-bold text-xs flex items-center justify-center gap-2 uppercase active:scale-95 transition-transform">
                    📋 Số chủ: ${item.phone}
                </button>

                <div class="flex items-center text-[10px] text-gray-400 font-bold uppercase tracking-wider border-t pt-2 mt-1">
                    <span>👤 Chủ: ${item.owner || "Trống"}</span>
                </div>
            </div>
        `;

        div.querySelector('.btn-detail').onclick = () => {
            if(item.detailLink && item.detailLink !== "") window.open(item.detailLink, '_blank');
            else window.open(`https://drive.google.com/drive/u/0/search?q=parent:${DRIVE_FOLDER_ID}%20${encodeURIComponent(item.address)}`, '_blank');
        };

        div.querySelector('.btn-copy-imgs').onclick = () => {
            if(item.rawImgLinks.length > 0) copyToClipboard(item.rawImgLinks.join('\n'), "✅ Link ảnh đã copy!");
            else showToast("Không có link ảnh");
        };

        div.querySelector('.btn-copy-phone').onclick = () => copyToClipboard(item.phone, "✅ Số chủ đã copy!");

        fragment.appendChild(div);
    });

    box.innerHTML = "";
    box.appendChild(fragment);
    initLazyLoading();
}

function initLazyLoading() {
    const thumbs = document.querySelectorAll('.thumb[data-src]');
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                const el = entry.target;
                const src = el.getAttribute('data-src');
                const img = new Image();
                img.src = src;
                img.onload = () => {
                    el.style.backgroundImage = `url('${src}')`;
                    el.classList.remove('loading');
                    el.classList.add('loaded');
                };
                observer.unobserve(el);
            }
        });
    }, { rootMargin: '200px' });
    thumbs.forEach(t => observer.observe(t));
}

function openImg(src) {
    $("modalImg").src = src;
    $("imgModal").style.display = "flex";
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
